<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA4D87" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="podiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="podiumSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="podiumBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bold { font-weight: 800; }
    .semibold { font-weight: 700; }
    .medium { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <!-- Dark Backdrop -->
  <rect width="390" height="844" rx="32" fill="rgba(10,13,18,0.6)"/>

  <!-- Slide-Over Drawer Body -->
  <g transform="translate(0, 0)">
    <rect width="310" height="844" rx="32 0 0 32" fill="#FFFFFF" filter="url(#dropShadow)"/>

    <!-- Drawer User Header Box -->
    <rect width="310" height="140" fill="#FAF5FF" stroke="#F3E8FF" stroke-width="1"/>
    <text x="24" y="38" fill="#181D27" class="bold" font-size="18">SHE STARTS</text>
    <text x="275" y="38" fill="#6B7280" class="bold" font-size="16">✕</text>

    <!-- User Avatar & Title -->
    <g transform="translate(24, 60)">
      <circle cx="24" cy="24" r="24" fill="url(#brandGrad)"/>
      <text x="24" y="31" fill="#FFFFFF" class="bold" font-size="18" text-anchor="middle">J</text>
      <text x="58" y="20" fill="#181D27" class="bold" font-size="15">John Doe (You)</text>
      <text x="58" y="38" fill="#7C3AED" class="semibold" font-size="11.5">Digital Marketing · 62% Ready</text>
    </g>

    <!-- Navigation Menu Items -->
    <g transform="translate(24, 160)">
      <text x="0" y="10" fill="#9CA3AF" class="bold" font-size="10" letter-spacing="1">CAREER ACCELERATION</text>

      <!-- Item 1 -->
      <g transform="translate(0, 24)">
        <rect width="262" height="42" rx="10" fill="#FDF2F8"/>
        <text x="36" y="26" fill="#FA4D87" class="bold" font-size="13">Career Progress &amp; Skills</text>
        <rect x="215" y="12" width="36" height="18" rx="9" fill="#10B981"/>
        <text x="233" y="24" fill="#FFFFFF" class="bold" font-size="9" text-anchor="middle">62%</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 74)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">Explore Programmes</text>
        <rect x="185" y="12" width="66" height="18" rx="9" fill="#F3E8FF"/>
        <text x="218" y="24" fill="#7C3AED" class="bold" font-size="9" text-anchor="middle">+28% YoY</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 124)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">STAR Interview Studio</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 174)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">Resume &amp; Break Pitch</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(0, 224)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">WFH Job Referrals</text>
        <rect x="210" y="12" width="42" height="18" rx="9" fill="#D1FAE5"/>
        <text x="231" y="24" fill="#047857" class="bold" font-size="9" text-anchor="middle">Active</text>
      </g>

      <text x="0" y="295" fill="#9CA3AF" class="bold" font-size="10" letter-spacing="1">ADVISOR &amp; SETTINGS</text>

      <!-- Item 6 -->
      <g transform="translate(0, 310)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">Talk to Advisor (Free)</text>
      </g>

      <!-- Item 7 -->
      <g transform="translate(0, 360)">
        <rect width="262" height="42" rx="10" fill="#FFFFFF"/>
        <text x="36" y="26" fill="#374151" class="bold" font-size="13">Profile &amp; Account</text>
      </g>
    </g>

    <!-- Drawer Footer -->
    <g transform="translate(24, 790)">
      <text x="0" y="20" fill="#9CA3AF" class="bold" font-size="11">SHE STARTS v2.4</text>
      <text x="260" y="20" fill="#EF4444" class="bold" font-size="11" text-anchor="end">Reset Progress</text>
    </g>
  </g>
</svg>