<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" width="350" height="90">
  
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA4D87" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="podiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="podiumSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="podiumBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bold { font-weight: 800; }
    .semibold { font-weight: 700; }
    .medium { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <rect width="350" height="90" rx="14" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Connecting Line -->
  <line x1="60" y1="35" x2="290" y2="35" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="60" y1="35" x2="175" y2="35" stroke="#10B981" stroke-width="3"/>

  <!-- Node 1: RESET (Completed) -->
  <g transform="translate(60, 35)">
    <circle cx="0" cy="0" r="14" fill="#10B981"/>
    <path d="M -5 0 L -1 4 L 6 -3" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="0" y="26" fill="#047857" class="bold" font-size="10" text-anchor="middle">RESET</text>
    <text x="0" y="38" fill="#6B7280" class="regular" font-size="8.5" text-anchor="middle">Clarity Done</text>
  </g>

  <!-- Node 2: REBUILD (Active) -->
  <g transform="translate(175, 35)">
    <circle cx="0" cy="0" r="16" fill="url(#brandGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <text x="0" y="26" fill="#7C3AED" class="bold" font-size="10" text-anchor="middle">REBUILD</text>
    <text x="0" y="38" fill="#7C3AED" class="semibold" font-size="8.5" text-anchor="middle">In Progress</text>
  </g>

  <!-- Node 3: RESTART (Upcoming) -->
  <g transform="translate(290, 35)">
    <circle cx="0" cy="0" r="14" fill="#E5E7EB"/>
    <circle cx="0" cy="0" r="4" fill="#9CA3AF"/>
    <text x="0" y="26" fill="#6B7280" class="bold" font-size="10" text-anchor="middle">RESTART</text>
    <text x="0" y="38" fill="#9CA3AF" class="regular" font-size="8.5" text-anchor="middle">Job Ready</text>
  </g>
</svg>