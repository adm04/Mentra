<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 160" width="350" height="160">
  
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA4D87" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="podiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="podiumSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="podiumBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bold { font-weight: 800; }
    .semibold { font-weight: 700; }
    .medium { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <rect width="350" height="160" rx="16" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="18" y="28" fill="#7C3AED" class="bold" font-size="11" letter-spacing="0.5">MARKET OPPORTUNITY</text>
  <text x="18" y="48" fill="#181D27" class="bold" font-size="15">+28% Hiring Growth (YoY)</text>
  
  <!-- Line Grid -->
  <line x1="18" y1="80" x2="332" y2="80" stroke="#E9D5FF" stroke-dasharray="3 3"/>
  <line x1="18" y1="115" x2="332" y2="115" stroke="#E9D5FF" stroke-dasharray="3 3"/>

  <!-- Area Fill -->
  <path d="M 20 125 Q 90 120 160 95 T 330 65 L 330 145 L 20 145 Z" fill="url(#chartGrad)"/>
  
  <!-- Trend Line -->
  <path d="M 20 125 Q 90 120 160 95 T 330 65" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Point Badge -->
  <circle cx="330" cy="65" r="5" fill="#FA4D87" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="250" y="38" width="80" height="20" rx="10" fill="#7C3AED"/>
  <text x="290" y="52" fill="#FFFFFF" class="bold" font-size="10" text-anchor="middle">120k+ Openings</text>
  
  <text x="20" y="145" fill="#8B5CF6" class="medium" font-size="10">2023</text>
  <text x="165" y="145" fill="#8B5CF6" class="medium" font-size="10">2024</text>
  <text x="310" y="145" fill="#8B5CF6" class="bold" font-size="10">2026 ↗</text>
</svg>