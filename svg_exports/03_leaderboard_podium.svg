<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200">
  
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA4D87" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="podiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="podiumSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="podiumBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bold { font-weight: 800; }
    .semibold { font-weight: 700; }
    .medium { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <rect width="350" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 2nd Place (John Doe) -->
  <g transform="translate(30, 40)">
    <circle cx="45" cy="25" r="22" fill="#FDF2F8" stroke="#FA4D87" stroke-width="2"/>
    <text x="45" y="31" fill="#7C3AED" class="bold" font-size="14" text-anchor="middle">J</text>
    <rect x="35" y="38" width="20" height="14" rx="7" fill="#94A3B8"/>
    <text x="45" y="48" fill="#FFFFFF" class="bold" font-size="9" text-anchor="middle">#2</text>
    <text x="45" y="65" fill="#181D27" class="bold" font-size="11" text-anchor="middle">John (You)</text>
    <text x="45" y="78" fill="#FA4D87" class="bold" font-size="10" text-anchor="middle">1,180 XP</text>
    <rect x="15" y="85" width="60" height="55" rx="8" fill="url(#podiumSilver)"/>
    <text x="45" y="118" fill="#1E293B" class="bold" font-size="14" text-anchor="middle">2nd</text>
  </g>

  <!-- 1st Place (Rohan Verma) -->
  <g transform="translate(130, 20)">
    <circle cx="45" cy="25" r="24" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="45" y="32" fill="#B45309" class="bold" font-size="16" text-anchor="middle">👑 R</text>
    <rect x="35" y="40" width="20" height="14" rx="7" fill="#F59E0B"/>
    <text x="45" y="50" fill="#FFFFFF" class="bold" font-size="9" text-anchor="middle">#1</text>
    <text x="45" y="67" fill="#181D27" class="bold" font-size="12" text-anchor="middle">Rohan V.</text>
    <text x="45" y="80" fill="#D97706" class="bold" font-size="11" text-anchor="middle">1,240 XP</text>
    <rect x="10" y="87" width="70" height="73" rx="8" fill="url(#podiumGold)"/>
    <text x="45" y="128" fill="#78350F" class="bold" font-size="16" text-anchor="middle">1st</text>
  </g>

  <!-- 3rd Place (Priya Sharma) -->
  <g transform="translate(230, 50)">
    <circle cx="45" cy="25" r="20" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="45" y="31" fill="#C2410C" class="bold" font-size="13" text-anchor="middle">P</text>
    <rect x="35" y="36" width="20" height="14" rx="7" fill="#FB923C"/>
    <text x="45" y="46" fill="#FFFFFF" class="bold" font-size="9" text-anchor="middle">#3</text>
    <text x="45" y="63" fill="#181D27" class="bold" font-size="11" text-anchor="middle">Priya S.</text>
    <text x="45" y="76" fill="#EA580C" class="bold" font-size="10" text-anchor="middle">1,050 XP</text>
    <rect x="15" y="83" width="60" height="47" rx="8" fill="url(#podiumBronze)"/>
    <text x="45" y="112" fill="#7C2D12" class="bold" font-size="14" text-anchor="middle">3rd</text>
  </g>
</svg>